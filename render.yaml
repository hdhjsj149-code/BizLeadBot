services:
  - type: worker
    name: bizleadbot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_PATH
        value: data/bizleadbot.db
      - key: MAX_PAGES
        value: "10"
      - key: MAX_LEADS
        value: "5000"
      - key: REQUEST_TIMEOUT
        value: "20"
      - key: OUTPUT_DIR
        value: output
    disk:
      name: bizleadbot-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
